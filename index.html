<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Login Form | Login your account</title>
  </head>
  <body>
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Login Form</title>
      </head>

      <body>
        <!-- This is our Main Box of Login Form -->
        <section class="main-container">
          <div class="main-box">
            <div class="centering-box">
              <!-- For the starting box in the Main Box -->
              <span class="starting-box"></span>

              <!-- For the main Heading -->
              <h1 id="heading">Welcome back</h1>
            </div>
            <!--Simple Question Related to the Account-->
            <div class="first-paragraph">
              <p id="paragraph">Don't have a account?</p>
              &nbsp;
              <a id="for-new-account">Sign up</a>
            </div>

            <!--For Singing or Log in the Existing Account of Google or Apple-->
            <div class="existing-accounts-boxes">
              <div class="box-for-login-google">Google</div>
              <div class="box-for-login-apple">Apple</div>
            </div>

            <hr />
            <!--Continue With-->
            <div class="para-for-continue">
              <p>OR CONTINUE WITH</p>
            </div>

            <!--Fill the info to create a New Account-->
            <form action="get">
              <label for="username">Email address</label>
              <input type="email" id="email" placeholder="name@company.com" />

              <div class="password-setting">
                <label for="username">Password</label>
                <a id="forgot-password">Forgot password?</a>
              </div>

              <input type="password" id="password" placeholder="*****" />
            </form>
          </div>
        </section>
      </body>
    </html>
  </body>
</html>
